name: MiBar
options:
  bundleIdPrefix: com.artashesyeghiazaryan
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: RCM82X5MZ7
    CODE_SIGN_STYLE: Automatic
targets:
  MiBar:
    type: application
    platform: iOS
    sources:
      - path: MiBar
        excludes:
          - Info.plist
    dependencies:
      - target: MiBarWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.artashesyeghiazaryan.mibar
        INFOPLIST_FILE: MiBar/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MiBar
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSMotionUsageDescription: "MiBar uses your phone’s tilt so letters can gather into words."
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: MiBar/Info.plist
      properties:
        CFBundleDisplayName: MiBar
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIAppFonts:
          - Outfit.ttf
          - NotoSansArmenian.ttf
          - NotoSerifArmenian.ttf
        NSMotionUsageDescription: MiBar uses your phone’s tilt so letters can gather into words.
        UIUserInterfaceStyle: Light
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
  MiBarWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: MiBarWidget
      - path: MiBar/Fonts
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.artashesyeghiazaryan.mibar.widget
        INFOPLIST_FILE: MiBarWidget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
    info:
      path: MiBarWidget/Info.plist
      properties:
        CFBundleDisplayName: MiBar
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - Outfit.ttf
          - NotoSansArmenian.ttf
          - NotoSerifArmenian.ttf
schemes:
  MiBar:
    build:
      targets:
        MiBar: all
        MiBarWidget: all
    run:
      config: Debug
